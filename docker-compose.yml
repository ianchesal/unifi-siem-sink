services:
  unifi-siem-sink:
    build: .
    image: unifi-siem-sink:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "5514:10514/udp"
    env_file:
      - .env
    volumes:
      - siem-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  siem-data:
